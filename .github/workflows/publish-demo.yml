name: Build and Publish Demo to GitHub Pages

on:
  push:
    branches:
      - master
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app (demo build)
        run: npm run build
        env:
          VITE_BASE_URL: /ha-dashboard/
          # The demo has no server: it embeds the sample config and local data at
          # build time (see src/demo/demoData.ts) instead of reading data files.
          VITE_DEMO: "true"

      - name: Verify the demo contains no data files or credentials
        run: |
          if [ -e dist/data ]; then
            echo "Refusing to publish: dist/data must not exist" >&2
            exit 1
          fi
          # No token-shaped (JWT) strings anywhere in the published files.
          if grep -rEl 'eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,}\.' dist; then
            echo "Refusing to publish: credential-like string found" >&2
            exit 1
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: false
