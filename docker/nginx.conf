# Runs as the unprivileged "node" user: no privileged ports, all writable paths in /tmp.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    server {
        listen 8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        # SSL configuration (Mozilla "intermediate")
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        client_max_body_size 1m;

        # API (Node.js backend)
        # ^~ so the static-asset regex below (.png etc.) can't capture /api/images/*.png
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:3000;
            # $http_host keeps the port; the backend's Origin check compares against it
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite, never append: the backend trusts exactly one proxy hop
            # and must not see client-supplied X-Forwarded-For values.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 3m;
        }

        # Image uploads: up to 10 files of 10 MB (enforced again by the backend)
        location = /api/images/upload {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            client_max_body_size 105m;
        }

        # The data directory (configuration, local data, images, backups, sessions) is
        # only ever reachable through the API (/api/config, /api/data/local,
        # /api/images/...). No file below /data/ is served.
        location ^~ /data/ {
            return 404;
        }

        # Service worker - no cache
        location = /sw.js {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
            expires 0;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
